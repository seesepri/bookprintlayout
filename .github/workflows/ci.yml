name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # 22.x resolves to >=22.22.2, the floor jsdom@30 needs (pdfjs@6 only wants 22.13).
      # Keep this on a line that satisfies package.json 'engines.node' or the component
      # tests fail to load instead of being skipped.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Security audit (runtime deps only)
        run: npm audit --omit=dev --audit-level=high

      - name: Build
        run: npm run build

      # A single-file build has no dependency budget of its own, so the size
      # that users actually download is the gate. 1.1 MB keeps ~200 kB headroom.
      - name: Bundle size guard
        run: |
          size=$(gzip -c dist/index.html | wc -c)
          echo "dist/index.html gzip: $size bytes"
          if [ "$size" -gt 1126400 ]; then
            echo "::error::gzip bundle melewati 1.1 MB — periksa dependensi baru"
            exit 1
          fi

      - name: Deploy config validates (dry run, nothing uploaded)
        run: npx --yes wrangler@4 deploy --dry-run --outdir /tmp/wrangler-dry

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          retention-days: 7
